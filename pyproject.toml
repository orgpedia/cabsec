[project]
name = "orgpedia-cabsec"
version = "0.0.12"
description = "Datapackage containing orders of Cabinet Secretariat from https://cabsec.gov.in/."
authors = [{ name = "Orgpedia Foundation", email = "orgpedia.foundation@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">3.8.1,<4.0"
keywords = ["information extraction", "data package", "government data"]
classifiers=[
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Scientific/Engineering :: Image Processing',
    'Topic :: Scientific/Engineering :: Image Recognition',
]

# this is a datapackage should not have any dependency as we are publishing data
# dependencies for running the flow are in dependency-groups.dev
dependencies = [
    "google-cloud-vision",
    "waybackpy",
    "google-cloud-storage",
    "numpy",
]

[project.urls]
"homepage" = "https://www.orgpedia.in/"
"repository" = "https://github.com/orgpedia/cabsec"
"data issues" = "https://github.com/orgpedia/cabsec/discussions"

[dependency-groups]
dev = [
    "docint",
    "orgpedia",
    "google-cloud-vision",
    "google-cloud-storage",
    "waybackpy",
    "numpy",
    "transformers[torch]",
    "setuptools<81",
    "more-itertools"
]

[tool.uv]
# the flow tooling (docint) needs python >= 3.10; the published datapackage does not
environments = ["python_version >= '3.10'"]

[tool.uv.sources]
docint = { git = "https://github.com/mukundesh/docInt.git" }
orgpedia = { git = "https://github.com/orgpedia/orgpedia.git" }

# packaging layout is still handled by poetry-core (>=2.0 reads the [project] table)
[tool.poetry]
packages = [ { include = "orgpedia_cabsec", from = "export" } ]
include = [ "export/orgpedia_cabsec/*" ]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.yml
  | \.json
  | \.txt
  | \.bak
  | makefile
  | _build
  | buck-out
  | build
  | dist
  | input
  | output
  | logs
  | conf
  | models
  | export
  | documents
)/
'''

[tool.ruff]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F", "W", "I001"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["I001"] # fix only isort issues
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    ".tox",
    "__pypackages__",
    "dist",
    "node_modules",
    "venv",
    ".bak",
    "input",
    "output",
    "logs",
    "conf",
    "export",
    "models",
    "documents",
    "data_packages",
    "websites",
    "page_images",
    "html",
]
per-file-ignores = {}

# Same as Black.
line-length = 100

# Allow unused variables when underscore-prefixed.
#dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.7
target-version = "py38"
